name: Patch official result phone payload

on:
  push:
    branches:
      - fix/mobile-ui-gatekeeper

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-ui-gatekeeper
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-official-result-phone.mjs
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npx prettier --write src/lib/club/runtime.mjs src/lib/club/runtime.test.mjs
      - run: npm run typecheck
      - run: node --test src/lib/club/runtime.test.mjs src/lib/club/api.test.mjs
      - run: npm run build:dev
      - name: Commit result payload fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve phone in official result submission"
          git push origin HEAD:fix/mobile-ui-gatekeeper
